service: back-risk-calculator
frameworkVersion: "3"

plugins:
  - serverless-offline

provider:
  name: aws
  # Serverless v3 accepts Node 20 for the packaging smoke. The production container keeps Node 26.
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: us-east-1
  memorySize: 1024
  timeout: 28
  logRetentionInDays: 14
  environment:
    NODE_ENV: ${self:provider.stage}
    PORT: ${env:PORT, '8000'}
    ACCESS_TOKEN_SECRET: ${env:ACCESS_TOKEN_SECRET, 'dev-only-change-me-risk-calculator-access-token-secret'}
    ACCESS_TOKEN_TTL_SECONDS: ${env:ACCESS_TOKEN_TTL_SECONDS, '900'}
    REFRESH_TOKEN_TTL_DAYS: ${env:REFRESH_TOKEN_TTL_DAYS, '30'}
    CORS_ALLOWED_ORIGINS: ${env:CORS_ALLOWED_ORIGINS, ''}
    DATABASE_URL: ${env:DATABASE_URL, 'postgres://risk_calculator:risk_calculator@127.0.0.1:5432/risk_calculator_dev'}
    PORTFOLIO_IMPORT_QUEUE_PROVIDER: sqs
    PORTFOLIO_IMPORT_QUEUE_URL:
      Ref: PortfolioImportQueue
    PORTFOLIO_IMPORT_DLQ_URL:
      Ref: PortfolioImportDeadLetterQueue
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource:
            - Fn::GetAtt: [PortfolioImportQueue, Arn]
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource:
            - Fn::GetAtt: [PortfolioImportDeadLetterQueue, Arn]

package:
  patterns:
    - "!**/*"
    - "dist/src/**"
    - "node_modules/**"
    - package.json
    - yarn.lock
    - .yarnrc.yml

functions:
  api:
    handler: dist/src/app.handler
    reservedConcurrency: 10
    events:
      - http:
          method: any
          path: /
      - http:
          method: any
          path: /{proxy+}

resources:
  Resources:
    PortfolioImportDeadLetterQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-portfolio-imports-dlq.fifo
        FifoQueue: true
        ContentBasedDeduplication: false
        MessageRetentionPeriod: 1209600

    PortfolioImportQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-portfolio-imports.fifo
        FifoQueue: true
        ContentBasedDeduplication: false
        VisibilityTimeout: 120
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt: [PortfolioImportDeadLetterQueue, Arn]
          maxReceiveCount: 3

  Outputs:
    PortfolioImportQueueUrl:
      Value:
        Ref: PortfolioImportQueue
    PortfolioImportDeadLetterQueueUrl:
      Value:
        Ref: PortfolioImportDeadLetterQueue

custom:
  serverless-offline:
    httpPort: 8000
    lambdaPort: 3002
    noPrependStageInUrl: true
